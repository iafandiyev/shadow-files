name: Build SHADOW FILES iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-files-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version and project scheme
        run: |
          xcodebuild -version
          xcodebuild -list -project SHADOWFILES.xcodeproj

      - name: Build for generic iOS device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          xcodebuild \
            -project SHADOWFILES.xcodeproj \
            -scheme SHADOWFILES \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/logs/ios-build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"
          test -d "$APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/SHADOWFILES.app
          (cd dist && /usr/bin/zip -qry SHADOW-FILES-unsigned.ipa Payload)
          test -s dist/SHADOW-FILES-unsigned.ipa
          /usr/bin/unzip -l dist/SHADOW-FILES-unsigned.ipa | head -40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-unsigned-IPA
          path: dist/SHADOW-FILES-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-build-log
          path: build/logs/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
