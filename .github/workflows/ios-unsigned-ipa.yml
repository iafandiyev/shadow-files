
name: Build SHADOW FILES iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-files-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_16.4.app/Contents/Developer"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "ERROR: Xcode 16.4 is not installed."
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"

          echo "Selected Xcode:"
          xcodebuild -version

          echo "Developer directory:"
          xcode-select -p

      - name: Verify iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Available SDKs:"
          xcodebuild -showsdks

          echo "Checking iPhoneOS SDK..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)

          echo "SDK path: $SDK_PATH"
          echo "SDK version: $SDK_VERSION"

          test -d "$SDK_PATH"

      - name: Check project and scheme
        shell: bash
        run: |
          set -euo pipefail

          test -d SHADOWFILES.xcodeproj
          test -f SHADOWFILES/Info.plist

          xcodebuild -list -project SHADOWFILES.xcodeproj

      - name: Prepare folders
        shell: bash
        run: |
          mkdir -p build/logs
          mkdir -p build/crash-reports
          mkdir -p dist/Payload

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -uo pipefail

          set +e

          xcodebuild \
            -project SHADOWFILES.xcodeproj \
            -scheme SHADOWFILES \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/logs/ios-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "XCODE BUILD FAILED: $BUILD_STATUS"

            find "$HOME/Library/Logs/DiagnosticReports" \
              -maxdepth 1 \
              -type f \
              -mmin -60 \
              \( -name 'xcodebuild*' -o -name 'Xcode*' \) \
              -exec cp {} build/crash-reports/ \; \
              2>/dev/null || true

            exit "$BUILD_STATUS"
          fi

          echo "XCODE BUILD SUCCEEDED"

      - name: Verify generated app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: SHADOWFILES.app was not generated."
            exit 1
          fi

          test -f "$APP_PATH/Info.plist"

          echo "App generated successfully:"
          ls -lah "$APP_PATH"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"

          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/SHADOWFILES.app

          cd dist

          /usr/bin/zip -qry SHADOW-FILES-unsigned.ipa Payload

          test -s SHADOW-FILES-unsigned.ipa

          echo "IPA successfully created:"
          ls -lh SHADOW-FILES-unsigned.ipa

          /usr/bin/unzip -t SHADOW-FILES-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-unsigned-IPA
          path: dist/SHADOW-FILES-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-build-diagnostics
          path: |
            build/logs/
            build/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
