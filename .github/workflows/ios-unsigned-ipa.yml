
name: Build SHADOW FILES iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-files-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List installed Xcode versions
        shell: bash
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true

          echo ""
          echo "Selected Xcode:"
          xcode-select -p

          echo ""
          xcodebuild -version

      - name: Check project and scheme
        shell: bash
        run: |
          set -euo pipefail

          test -d SHADOWFILES.xcodeproj

          echo "Available project schemes:"
          xcodebuild -list -project SHADOWFILES.xcodeproj

      - name: Prepare build folders
        shell: bash
        run: |
          mkdir -p build/logs
          mkdir -p dist/Payload

      - name: Build for generic iOS device
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project SHADOWFILES.xcodeproj \
            -scheme SHADOWFILES \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/logs/ios-build.log

      - name: Verify generated app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: SHADOWFILES.app was not generated."
            exit 1
          fi

          echo "App successfully generated:"
          ls -lah "$APP_PATH"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"

          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/SHADOWFILES.app

          cd dist

          /usr/bin/zip -qry SHADOW-FILES-unsigned.ipa Payload

          test -s SHADOW-FILES-unsigned.ipa

          echo "IPA successfully created:"
          ls -lh SHADOW-FILES-unsigned.ipa

          /usr/bin/unzip -l SHADOW-FILES-unsigned.ipa | head -40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-unsigned-IPA
          path: dist/SHADOW-FILES-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
