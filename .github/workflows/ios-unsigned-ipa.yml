
name: Build SHADOW FILES iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-files-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        shell: bash
        run: |
          set -euo pipefail

          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          if [ ! -d "/Applications/Xcode_16.3.app" ]; then
            echo "Xcode 16.3 not found."
            exit 1
          fi

          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

          echo "Selected Xcode:"
          xcode-select -p
          xcodebuild -version

      - name: Check project and scheme
        shell: bash
        run: |
          set -euo pipefail

          test -d SHADOWFILES.xcodeproj
          test -f SHADOWFILES/Info.plist

          xcodebuild -list -project SHADOWFILES.xcodeproj

      - name: Prepare build folders
        shell: bash
        run: |
          mkdir -p build/logs
          mkdir -p build/crash-reports
          mkdir -p dist/Payload

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -uo pipefail

          set +e
          xcodebuild \
            -project SHADOWFILES.xcodeproj \
            -scheme SHADOWFILES \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/logs/ios-build.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "Xcode build failed with exit code: $BUILD_STATUS"

            echo "Collecting crash reports..."

            find "$HOME/Library/Logs/DiagnosticReports" \
              -maxdepth 1 \
              \( -name 'xcodebuild*' -o -name 'Xcode*' \) \
              -type f \
              -mmin -30 \
              -exec cp {} build/crash-reports/ \; 2>/dev/null || true

            echo "Recent crash reports:"
            ls -lah build/crash-reports || true

            exit "$BUILD_STATUS"
          fi

      - name: Verify generated app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: SHADOWFILES.app was not generated."
            exit 1
          fi

          echo "App generated successfully:"
          ls -lah "$APP_PATH"

          test -f "$APP_PATH/Info.plist"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"

          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/SHADOWFILES.app

          cd dist

          /usr/bin/zip -qry SHADOW-FILES-unsigned.ipa Payload

          test -s SHADOW-FILES-unsigned.ipa

          echo "IPA created:"
          ls -lh SHADOW-FILES-unsigned.ipa

          /usr/bin/unzip -t SHADOW-FILES-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-unsigned-IPA
          path: dist/SHADOW-FILES-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-build-diagnostics
          path: |
            build/logs/
            build/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
