
name: Build SHADOW FILES iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: SHADOWFILES.xcodeproj
  SCHEME: SHADOWFILES

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          mkdir -p build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SHADOWFILES.app"

          test -d "$APP_PATH"

          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/

          cd dist
          zip -qry SHADOW-FILES-unsigned.ipa Payload

          test -s SHADOW-FILES-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-unsigned-IPA
          path: dist/SHADOW-FILES-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-build-log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 7
