
name: Build SHADOW FILES iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-files-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_16.4.app/Contents/Developer"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode 16.4 not found"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version
          xcode-select -p

      - name: Verify iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -showsdks

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)

          echo "SDK PATH: $SDK_PATH"
          echo "SDK VERSION: $SDK_VERSION"

          test -d "$SDK_PATH"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -d SHADOWFILES.xcodeproj
          test -f SHADOWFILES/Info.plist

          echo "Checking project file..."
          plutil -lint SHADOWFILES.xcodeproj/project.pbxproj

          echo "Source files:"
          find SHADOWFILES -type f

          echo "Available schemes:"
          xcodebuild -list -project SHADOWFILES.xcodeproj

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/logs
          mkdir -p build/crash-reports
          mkdir -p dist/Payload

      - name: Collect environment information
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=== SYSTEM ==="
            sw_vers

            echo "=== XCODE ==="
            xcodebuild -version

            echo "=== SWIFT ==="
            swift --version

            echo "=== SDK ==="
            xcrun --sdk iphoneos --show-sdk-version

            echo "=== ARCHITECTURE ==="
            uname -m

            echo "=== PROJECT ==="
            pwd
            ls -la
          } 2>&1 | tee build/logs/environment.log

      - name: Diagnose Xcode target settings
        shell: bash
        run: |
          set +e

          mkdir -p build/logs build/crash-reports

          echo "=========================================="
          echo "TEST 1: Direct target settings"
          echo "=========================================="

          xcodebuild \
            -project SHADOWFILES.xcodeproj \
            -target SHADOWFILES \
            -configuration Debug \
            -sdk iphoneos \
            -showBuildSettings \
            > build/logs/target-settings.log 2>&1

          TARGET_STATUS=$?

          echo "TARGET EXIT CODE: $TARGET_STATUS"

          echo "=========================================="
          echo "TEST 2: Project parsing"
          echo "=========================================="

          plutil -lint SHADOWFILES.xcodeproj/project.pbxproj \
            > build/logs/plutil.log 2>&1

          cat build/logs/plutil.log

          echo "=========================================="
          echo "TEST 3: Xcode diagnostic logs"
          echo "=========================================="

          log show \
            --last 10m \
            --style compact \
            --predicate 'process == "xcodebuild"' \
            > build/logs/xcode-system.log 2>&1 || true

          echo "=========================================="
          echo "TEST 4: Crash reports"
          echo "=========================================="

          for DIR in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "/Library/Logs/DiagnosticReports" \
            "/private/var/log"
          do
            if [ -d "$DIR" ]; then
              find "$DIR" \
                -type f \
                -mmin -120 \
                \( \
                  -iname '*xcodebuild*' \
                  -o -iname '*xcbuild*' \
                \) \
                -exec cp {} build/crash-reports/ \; \
                2>/dev/null || true
            fi
          done

          echo "=========================================="
          echo "DIAGNOSTIC RESULT"
          echo "=========================================="

          echo "Target test result: $TARGET_STATUS"
          ls -lah build/crash-reports || true

          exit "$TARGET_STATUS"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -uo pipefail

          echo "Starting iOS build..."

          set +e

          xcodebuild \
            -project SHADOWFILES.xcodeproj \
            -scheme SHADOWFILES \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -jobs 1 \
            -verbose \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            SWIFT_ENABLE_BATCH_MODE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/logs/ios-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          echo "BUILD EXIT CODE: $BUILD_STATUS"

          for DIR in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "/Library/Logs/DiagnosticReports"
          do
            if [ -d "$DIR" ]; then
              find "$DIR" \
                -type f \
                -mmin -120 \
                \( \
                  -iname '*xcodebuild*' \
                  -o -iname '*swift*' \
                  -o -iname '*xcbuild*' \
                  -o -iname '*SourceKit*' \
                \) \
                -exec cp {} build/crash-reports/ \; \
                2>/dev/null || true
            fi
          done

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "iOS build failed"
            exit "$BUILD_STATUS"
          fi

          echo "iOS build succeeded"

      - name: Verify generated app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/SHADOWFILES.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "SHADOWFILES.app not found"
            find build/DerivedData -name "*.app" || true
            exit 1
          fi

          test -f "$APP_PATH/Info.plist"

          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo "Bundle version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PATH/Info.plist"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/SHADOWFILES.app"

          test -d "$APP_PATH"

          rm -rf dist/Payload
          mkdir -p dist/Payload

          cp -R "$APP_PATH" dist/Payload/SHADOWFILES.app

          cd dist

          /usr/bin/zip -qry SHADOW-FILES-unsigned.ipa Payload

          test -s SHADOW-FILES-unsigned.ipa

          /usr/bin/unzip -t SHADOW-FILES-unsigned.ipa

          ls -lh SHADOW-FILES-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-unsigned-IPA
          path: dist/SHADOW-FILES-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-build-diagnostics
          path: |
            build/logs/
            build/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
