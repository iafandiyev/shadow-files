
name: Build SHADOW FILES iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-files-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_16.4.app/Contents/Developer"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode 16.4 not found"
            ls -la /Applications/Xcode*.app || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version
          xcode-select -p
          uname -m

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -d SHADOWFILES.xcodeproj
          test -f SHADOWFILES/Info.plist

          plutil -lint SHADOWFILES.xcodeproj/project.pbxproj

          echo "Checking schemes..."
          xcodebuild -list -project SHADOWFILES.xcodeproj

          echo "Checking source files..."
          find SHADOWFILES -name "*.swift" -type f

      - name: Prepare build folders
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/logs
          mkdir -p build/crash-reports
          mkdir -p dist/Payload

      - name: Collect environment
        shell: bash
        run: |
          set -euo pipefail

          {
            sw_vers
            xcodebuild -version
            swift --version
            xcrun --sdk iphoneos --show-sdk-version
            uname -m
          } 2>&1 | tee build/logs/environment.log

      - name: Build iOS app
        shell: bash
        run: |
          set -uo pipefail

          echo "Starting iOS build..."

          set +e

          xcodebuild \
            -project SHADOWFILES.xcodeproj \
            -scheme SHADOWFILES \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            -jobs 1 \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/logs/ios-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          echo "BUILD EXIT CODE: $BUILD_STATUS"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "Build failed. Collecting diagnostics..."

            log show \
              --last 15m \
              --style compact \
              --predicate 'process == "xcodebuild"' \
              > build/logs/xcode-system.log 2>&1 || true

            for DIR in \
              "$HOME/Library/Logs/DiagnosticReports" \
              "/Library/Logs/DiagnosticReports"
            do
              if [ -d "$DIR" ]; then
                find "$DIR" \
                  -type f \
                  -mmin -120 \
                  \( \
                    -iname '*xcodebuild*' \
                    -o -iname '*xcbuild*' \
                    -o -iname '*swift*' \
                  \) \
                  -exec cp {} build/crash-reports/ \; \
                  2>/dev/null || true
              fi
            done

            exit "$BUILD_STATUS"
          fi

          echo "BUILD SUCCESS"

      - name: Verify app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/SHADOWFILES.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App not found!"
            find build/DerivedData -name "*.app" || true
            exit 1
          fi

          test -f "$APP_PATH/Info.plist"

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo "App successfully generated."

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/SHADOWFILES.app"

          test -d "$APP_PATH"

          rm -rf dist/Payload
          mkdir -p dist/Payload

          cp -R "$APP_PATH" dist/Payload/SHADOWFILES.app

          cd dist

          /usr/bin/zip -qry SHADOW-FILES-unsigned.ipa Payload

          test -s SHADOW-FILES-unsigned.ipa

          /usr/bin/unzip -t SHADOW-FILES-unsigned.ipa

          ls -lh SHADOW-FILES-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-unsigned-IPA
          path: dist/SHADOW-FILES-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-FILES-build-diagnostics
          path: |
            build/logs/
            build/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
